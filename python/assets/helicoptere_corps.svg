  <path d="M136 88 L132 104" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M122 90 C130 89 140 90 148 93" fill="none" stroke="#d6f1ff" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <!-- canon de nez -->
  <circle cx="164" cy="96" r="5" fill="#333" stroke="#111" stroke-width="1.5"/>
  <rect x="166" y="94" width="14" height="4" fill="#222"/>
  <!-- moyeu du rotor (repère) -->
