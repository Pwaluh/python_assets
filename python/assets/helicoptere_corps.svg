  <rect x="84" y="60" width="14" height="72" rx="3" fill="#4c5c3a" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="82" y="56" width="22" height="8" rx="4" fill="#333" stroke="#111" stroke-width="1.5"/>
  <rect x="82" y="128" width="22" height="8" rx="4" fill="#333" stroke="#111" stroke-width="1.5"/>
  <!-- fuselage -->
  <path d="M56 96 C56 80 72 76 98 76 C130 76 156 84 164 96 C156 108 130 116 98 116 C72 116 56 112 56 96 Z"
