  <path d="M70 88 C90 82 120 82 146 88" fill="none" stroke="#7a8f5c" stroke-width="4" stroke-linecap="round"/>
  <!-- moteurs -->
  <rect x="70" y="86" width="22" height="8" rx="3" fill="#3f4d2f" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="70" y="98" width="22" height="8" rx="3" fill="#3f4d2f" stroke="#1a1a1a" stroke-width="1.5"/>
