<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- ombre -->
  <ellipse cx="30" cy="34" rx="15" ry="17" fill="#000" opacity="0.25"/>
  <!-- sac à dos -->
  <rect x="12" y="23" width="10" height="18" rx="3" fill="#3a5a2a" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- épaules / torse -->
  <ellipse cx="28" cy="32" rx="10" ry="15" fill="#4f7a3a" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- bras arrière (gauche du perso, en bas) -->
  <path d="M30 42 L40 38 L44 35" fill="none" stroke="#3a5a2a" stroke-width="6" stroke-linecap="round"/>
  <!-- fusil -->
  <rect x="34" y="31" width="26" height="4" rx="1" fill="#2b2b2b" stroke="#111" stroke-width="1"/>
  <rect x="36" y="33" width="5" height="6" rx="1" fill="#2b2b2b" stroke="#111" stroke-width="1"/>
  <rect x="56" y="31.5" width="5" height="3" fill="#111"/>
  <!-- bras avant (droite du perso, en haut) -->
  <path d="M30 22 L40 27 L48 31" fill="none" stroke="#4f7a3a" stroke-width="6" stroke-linecap="round"/>
  <path d="M30 22 L40 27 L48 31" fill="none" stroke="#1a1a1a" stroke-width="7.5" stroke-linecap="round" opacity="0.0"/>
  <!-- mains -->
  <circle cx="44" cy="35" r="3" fill="#e0b48a" stroke="#1a1a1a" stroke-width="1"/>
  <circle cx="48" cy="31" r="3" fill="#e0b48a" stroke="#1a1a1a" stroke-width="1"/>
  <!-- casque -->
  <circle cx="30" cy="32" r="8.5" fill="#5d8a45" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="28" cy="30" r="4" fill="#3e6230" opacity="0.5"/>
  <circle cx="32" cy="29" r="1.6" fill="#fff" opacity="0.35"/>
</svg>